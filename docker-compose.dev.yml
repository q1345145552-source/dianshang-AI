# 开发环境覆盖
#
# 特点：应用端口和三个基础设施端口都暴露到本机，方便直接连库、连队列、
#       开 MinIO 网页控制台看文件。
#
# 起：make up            （ENV 默认就是 dev）

services:
  postgres:
    ports:
      - "${POSTGRES_PORT}:5432"

  redis:
    ports:
      - "${REDIS_PORT}:6379"

  minio:
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"

  api:
    ports:
      - "${API_PORT}:3001"

  web:
    ports:
      - "${WEB_PORT}:3000"
