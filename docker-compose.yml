# 电商作图平台 - 基础编排
#
# 三块应用：web(网站) / api(服务器) / worker(干活进程)
# 三个基础设施：postgres(数据库) / redis(队列) / minio(文件存储)
#
# 日常用同级目录的 Makefile，不要直接敲 docker compose。
#   起：make up          停：make down        清空重来：make clean
#   一键验证：make verify
#
# 环境差异写在 docker-compose.dev.yml / .test.yml / .prod.yml 里。
#
# 镜像版本全部钉到具体版本号，不用 latest 这种会漂的写法。
# 跑服务的进程都不是 root。

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine
    # 密码只在 REDIS_PASSWORD 有值的时候才给队列设上，没值就不设。
    # 应用侧读的是同一个变量，所以两边要么都有密码要么都没有，
    # 不会出现"应用带着密码去连一个没设密码的队列"。
    #
    # 这里自己用 setpriv 降权成 redis 用户。因为覆盖了 command 之后，
    # 镜像自带的 entrypoint 就不会再帮忙降权了（它只在第一个参数是
    # redis-server 的时候才降权），不自己降就会变成用 root 跑。
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec /usr/bin/setpriv --reuid redis --regid redis --clear-groups \
            redis-server --requirepass "$$REDIS_PASSWORD"
        fi
        exec /usr/bin/setpriv --reuid redis --regid redis --clear-groups redis-server
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping
          else
            redis-cli ping
          fi | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    # MinIO 官方在 2025 年 10 月把镜像从 Docker Hub 下架了，现在要从 quay.io 拉。
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    # 不用 root 跑服务：先把数据目录属主改成 1000，再降权成 1000 执行。
    # 跟 postgres、redis 官方镜像一个思路，最后跑服务的进程不是 root。
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        chown -R 1000:1000 /data
        exec chroot --userspec=1000:1000 / minio server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: ${APP_ENV}
      PORT: 3001
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./apps/worker
    environment:
      APP_ENV: ${APP_ENV}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      WORKER_QUEUE: ${WORKER_QUEUE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    environment:
      APP_ENV: ${APP_ENV}
      # 页面在服务端渲染时调后端用的内网地址，容器之间直接用服务名
      API_INTERNAL_URL: http://api:3001
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
